name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    name: React package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
        with:
          shellcheck: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - run: node scripts/assert-react-external.mjs
      - run: node scripts/assert-public-dts.mjs
      - run: npm pack --ignore-scripts
      - name: Install and import the packed tarball
        run: |
          set -euo pipefail
          smoke="$(mktemp -d)"
          cd "$smoke"
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/*.tgz
          cat > smoke.mjs <<'SMOKE'
          import * as api from '@fix-portal/fixatdl-react'
          import { existsSync, readFileSync } from 'node:fs'
          import { fileURLToPath } from 'node:url'

          // Node's resolver is the subject: a wrong exports condition, a types
          // path typo, or a missing files entry passes npm pack and only fails here.
          const entryUrl = import.meta.resolve('@fix-portal/fixatdl-react')
          const pkgRoot = new URL('../', entryUrl)
          if (!entryUrl.endsWith('/dist/index.js')) {
            throw new Error(`exports map resolved to an unexpected entry: ${entryUrl}`)
          }
          const manifest = JSON.parse(readFileSync(new URL('package.json', pkgRoot), 'utf8'))
          const typesPath = manifest.exports?.['.']?.types ?? manifest.types
          if (!typesPath || !existsSync(new URL(typesPath, pkgRoot))) {
            throw new Error(`types entry ${typesPath} does not exist in the installed package`)
          }
          if (typeof api.emitStrategyParametersGrp !== 'function') {
            throw new Error('emitStrategyParametersGrp did not resolve to a function')
          }
          const tags = api.emitStrategyParametersGrp({ parameters: [] }, {})
          if (!Array.isArray(tags) || tags.length !== 0) {
            throw new Error('emitStrategyParametersGrp({ parameters: [] }, {}) should return an empty tag list')
          }
          console.log(`tarball smoke OK: ${fileURLToPath(entryUrl)}`)
          SMOKE
          node smoke.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: fixatdl-react-package
          path: '*.tgz'
          if-no-files-found: error
  gate-coverage:
    name: Gate coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 .github/scripts/assert_gate_coverage.py .github/workflows/ci.yml
        env:
          # Publishing is downstream of the quality gate and only runs for release tags.
          GATE_EXEMPT: publish
  ci-gate:
    name: CI Gate
    if: always()
    needs: [package, gate-coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail if any upstream job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
  publish:
    name: Publish Package (npm)
    needs: ci-gate
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
        with:
          shellcheck: true
      - name: Require a release from main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD FETCH_HEAD
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          # No registry-url or NODE_AUTH_TOKEN: npm uses its trusted publisher.
      - name: Match tag to package version
        run: node --input-type=module -e 'import p from "./package.json" with { type:"json" }; if (process.env.GITHUB_REF_NAME !== "v" + p.version) { console.error("Tag", process.env.GITHUB_REF_NAME, "does not match package version", p.version); process.exit(1) }'
      - run: npm ci
      - run: npm publish --access public --provenance
