name: Scoped mutation
on:
  schedule:
    - cron: '41 3 * * 6'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scoped-mutation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  mutation:
    name: Pure value and state mutation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:mutation
      - name: Require conclusive nonempty mutation results
        run: node scripts/assert-mutation-report.mjs
      - name: Retain mutation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scoped-mutation-reports
          path: reports/mutation/
          if-no-files-found: error
