name: Bug report
description: Report a reproducible problem in the package or workbench.
title: "bug: "
labels:
  - bug
body:
  - type: input
    id: package-version
    attributes:
      label: Package version
      description: Which @fix-portal/fixatdl-react version is affected?
      placeholder: 0.3.0
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime versions
      description: Include Node, React, React DOM, browser, and OS versions.
      placeholder: Node 22, React 19.3, Chromium 140, Windows 11
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Give the smallest steps, code, fixture, or DTO that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Data handling
      options:
        - label: I removed credentials, broker data, and other confidential material.
          required: true
